[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-pdf-summarizer-biobert"
version = "1.0.0"
description = "BioBERT sentence-embedding extractive summarization for medical PDFs"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.38",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pypdf>=4.0",
  "nltk>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
