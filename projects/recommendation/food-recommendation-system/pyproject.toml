[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "food-recommendation-system"
version = "1.0.0"
description = "Content-based food recommendation with TF-IDF and cosine similarity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.scripts]
food-recommend = "food_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
