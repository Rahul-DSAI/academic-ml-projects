<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#123f4a"/><stop offset="1" stop-color="#197b70"/></linearGradient><style>.h{font:700 24px Arial;fill:#f5fbfa}.s{font:16px Arial;fill:#e4f2ef}.t{font:700 18px Arial;fill:#16343a}.d{font:14px Arial;fill:#426168}.arr{stroke:#27776e;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#27776e"/></marker></defs>
<rect width="1200" height="390" rx="26" fill="#f4f8f7"/>
<text x="600" y="45" text-anchor="middle" class="t" style="font-size:27px">Content-Based Food Recommendation Workflow</text>
<g transform="translate(40 105)"><rect width="205" height="165" rx="18" fill="url(#g)"/><text x="102" y="42" text-anchor="middle" class="h">Food catalogue</text><text x="102" y="77" text-anchor="middle" class="s">Menu name &amp; info</text><text x="102" y="103" text-anchor="middle" class="s">Tags &amp; dietary</text><text x="102" y="129" text-anchor="middle" class="s">Style, flavour, meal</text></g>
<g transform="translate(285 105)"><rect width="205" height="165" rx="18" fill="#dcefeb" stroke="#9bc9c0"/><text x="102" y="42" text-anchor="middle" class="t">Text profiles</text><text x="102" y="77" text-anchor="middle" class="d">Normalize fields</text><text x="102" y="103" text-anchor="middle" class="d">Combine descriptions</text><text x="102" y="129" text-anchor="middle" class="d">TF-IDF vectors</text></g>
<g transform="translate(530 105)"><rect width="205" height="165" rx="18" fill="#dcefeb" stroke="#9bc9c0"/><text x="102" y="42" text-anchor="middle" class="t">Preference profile</text><text x="102" y="77" text-anchor="middle" class="d">One or more dishes</text><text x="102" y="103" text-anchor="middle" class="d">Mean preference vector</text><text x="102" y="129" text-anchor="middle" class="d">User taste representation</text></g>
<g transform="translate(775 105)"><rect width="175" height="165" rx="18" fill="#dcefeb" stroke="#9bc9c0"/><text x="87" y="42" text-anchor="middle" class="t">Similarity</text><text x="87" y="77" text-anchor="middle" class="d">Cosine score</text><text x="87" y="103" text-anchor="middle" class="d">Rank candidates</text><text x="87" y="129" text-anchor="middle" class="d">Exclude preferences</text></g>
<g transform="translate(990 105)"><rect width="170" height="165" rx="18" fill="url(#g)"/><text x="85" y="42" text-anchor="middle" class="h">Top-N</text><text x="85" y="77" text-anchor="middle" class="s">Food items</text><text x="85" y="103" text-anchor="middle" class="s">Restaurant</text><text x="85" y="129" text-anchor="middle" class="s">Rating &amp; score</text></g>
<path class="arr" d="M245 187 H278"/><path class="arr" d="M490 187 H523"/><path class="arr" d="M735 187 H768"/><path class="arr" d="M950 187 H983"/>
<text x="600" y="335" text-anchor="middle" class="d">Descriptive attributes → TF-IDF representation → cosine similarity → ranked recommendations</text>
