<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#192b3b"/></linearGradient></defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <text x="600" y="46" fill="#e8f1f5" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">CNN Recognition Pipeline</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="36" y="105" width="174" height="126" rx="16" fill="#203b4c" stroke="#49d6b0" stroke-width="2"/><text x="123" y="151" fill="#49d6b0" font-size="18" font-weight="700">Input</text><text x="123" y="181" fill="#e8f1f5" font-size="17">28 × 28</text><text x="123" y="207" fill="#e8f1f5" font-size="17">Grayscale</text></g>
