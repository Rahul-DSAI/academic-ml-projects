    <g><rect x="484" y="105" width="174" height="126" rx="16" fill="#203b4c" stroke="#49d6b0" stroke-width="2"/><text x="571" y="151" fill="#49d6b0" font-size="18" font-weight="700">Conv Block 2</text><text x="571" y="181" fill="#e8f1f5" font-size="16">128 → 256 filters</text><text x="571" y="207" fill="#e8f1f5" font-size="16">BatchNorm + Pool</text></g>
