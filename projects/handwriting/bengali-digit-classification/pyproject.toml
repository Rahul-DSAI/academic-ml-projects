[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bengali-digit-recognition"
version = "1.0.0"
description = "CNN-based recognition of ten Bengali handwritten digit classes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tensorflow>=2.15",
  "numpy>=1.24",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
