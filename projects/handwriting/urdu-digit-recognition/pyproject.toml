[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urdu-handwriting-recognition"
version = "1.0.0"
description = "Urdu handwritten character and digit recognition with TensorFlow and PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=9.5", "scikit-learn>=1.3"]

[project.optional-dependencies]
characters-tf = ["tensorflow>=2.15"]
digits-torch = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
