[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kannada-mnist-digit-recognition"
version = "1.0.0"
description = "CNN-based Kannada handwritten digit recognition using Kannada-MNIST"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scikit-learn>=1.2",
  "tensorflow>=2.13",
  "matplotlib>=3.7",
  "Pillow>=9.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
