<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="22" fill="#f7fafc"/><text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#172554">Kannada-MNIST CNN Workflow</text><g font-family="Arial" text-anchor="middle"><g><rect x="48" y="155" width="190" height="130" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="143" y="199" font-size="21" font-weight="700" fill="#1e3a8a">NPZ dataset</text><text x="143" y="233" font-size="16" fill="#1e3a8a">28 × 28 grayscale</text><text x="143" y="258" font-size="16" fill="#1e3a8a">images + labels</text></g><g><rect x="285" y="155" width="190" height="130" rx="15" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="380" y="199" font-size="21" font-weight="700" fill="#164e63">Preprocessing</text><text x="380" y="233" font-size="16" fill="#164e63">Normalize to [0,1]</text><text x="380" y="258" font-size="16" fill="#164e63">Stratified split</text></g><g><rect x="522" y="155" width="190" height="130" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="617" y="199" font-size="21" font-weight="700" fill="#14532d">CNN model</text><text x="617" y="233" font-size="16" fill="#14532d">Conv + BatchNorm</text><text x="617" y="258" font-size="16" fill="#14532d">Pooling + Dropout</text></g><g><rect x="759" y="155" width="190" height="130" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="854" y="199" font-size="21" font-weight="700" fill="#78350f">Training</text><text x="854" y="233" font-size="16" fill="#78350f">Validation callbacks</text><text x="854" y="258" font-size="16" fill="#78350f">Best checkpoint</text></g><g><rect x="996" y="155" width="160" height="130" rx="15" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="1076" y="199" font-size="21" font-weight="700" fill="#581c87">Prediction</text><text x="1076" y="233" font-size="16" fill="#581c87">Classes 0–9</text><text x="1076" y="258" font-size="16" fill="#581c87">Test report</text></g></g><g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M238 220 H278 M268 210 L278 220 L268 230"/><path d="M475 220 H515 M505 210 L515 220 L505 230"/><path d="M712 220 H752 M742 210 L752 220 L742 230"/><path d="M949 220 H989 M979 210 L989 220 L979 230"/></g><text x="600" y="382" font-family="Arial" text-anchor="middle" font-size="19" fill="#334155">Training data → train / validation split · Official test data remains untouched until final evaluation</text><text x="600" y="421" font-family="Arial" text-anchor="middle" font-size="16" fill="#64748b">Built with TensorFlow / Keras · 10-class handwritten digit classification</text></svg>