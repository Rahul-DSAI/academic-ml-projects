[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-eye-detection-opencv"
version = "1.0.0"
description = "Face and eye detection with OpenCV Haar cascades, including webcam support."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3.0",
  "opencv-python>=4.8,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
